name: Verify Personal Workspace

on:
  push:
    branches:
      - verify/personal-file-workspace-c240

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ed9c3733da949b78dbd997a15f1bfe657686fabe
          fetch-depth: 1
          submodules: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare pinned ArtiSys dependencies
        run: npm run ci:bootstrap

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check electron/services/workspace-service.cjs
          node --check electron/ipc-handlers.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Unit and contract tests
        run: npm test

      - name: TypeScript and Vite build
        run: npm run build

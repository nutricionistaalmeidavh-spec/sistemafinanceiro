name: Financeiro · Documentos Open Source CI

on:
  push:
    branches: [feat/open-source-document-suite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Node 22 · Tests, React build, OCR offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned ArtiSys modules
        run: npm run ci:bootstrap
      - name: Install pinned open-source dependencies
        run: npm install --no-audit --no-fund
      - name: Node.js unit and integration tests
        run: npm test
      - name: Verify TypeScript and Vite production build
        run: npm run build
      - name: Stage offline Portuguese OCR language data
        run: npm run ocr:stage
      - name: Verify package has no runtime CDN requirement
        run: |
          node -e "const fs=require('fs');const f=fs.readFileSync('resources/ocr-data/por.traineddata.gz');if(f.length<100000)process.exit(1)"
      - name: OCR smoke with generated fictional fixture
        run: |
          node - <<'NODE'
          const { createCanvas } = require('@napi-rs/canvas');
          const { createWorker } = require('tesseract.js');
          (async () => {
            const canvas = createCanvas(700,140);
            const context = canvas.getContext('2d');
            context.fillStyle = 'white'; context.fillRect(0,0,700,140);
            context.fillStyle = 'black'; context.font = '40px Arial';
            context.fillText('EXTRATO PIX 123,45',20,80);
            const worker = await createWorker('por',1,{langPath:'resources/ocr-data',cacheMethod:'none'});
            try {
              const result=await worker.recognize(canvas.toBuffer('image/png'));
              if (!result?.data?.text?.trim()) throw new Error('Local OCR returned empty result');
              console.log('[offline OCR]', result.data.text.trim());
            } finally {await worker.terminate();}
          })().catch(error => {console.error(error);process.exitCode=1});
          NODE

      - name: Rasterize fictional scanned PDF and OCR entirely offline
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { createCanvas } = require('@napi-rs/canvas');
          const { PDFDocument } = require('pdf-lib');
          const { recognizeLocal } = require('./electron/services/attachment-ocr-service.cjs');
          (async () => {
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'artisys-scanned-ocr-'));
            try {
              const canvas = createCanvas(1000, 220);
              const ctx = canvas.getContext('2d');
              ctx.fillStyle='white';ctx.fillRect(0,0,1000,220);
              ctx.fillStyle='black';ctx.font='54px Arial';ctx.fillText('RECIBO TESTE 123,45',25,120);
              const pdf = await PDFDocument.create();
              const page = pdf.addPage([500,130]);
              const png = await pdf.embedPng(canvas.toBuffer('image/png'));
              page.drawImage(png,{x:0,y:0,width:500,height:130});
              const filename=path.join(directory,'teste-ocr.pdf');
              fs.writeFileSync(filename,await pdf.save());
              const result=await recognizeLocal(filename,'por');
              if (!result?.text?.trim()) throw new Error('Scanned PDF OCR returned empty text');
              console.log('[scanned PDF OCR]',result.text.trim());
            } finally {
              fs.rmSync(directory,{recursive:true,force:true});
            }
          })().catch(error=>{ console.error(error); process.exitCode=1; });
          NODE

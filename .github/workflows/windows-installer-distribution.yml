name: Financeiro · Instalador Windows validado

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-distribution.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-distribution.yml'

permissions:
  contents: read

jobs:
  finance-installer:
    name: Build Windows NSIS e SHA-256
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependências ArtiSys fixadas
        run: npm run ci:bootstrap
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar testes do produto
        run: npm test
      - name: Build do renderer
        run: npm run build
      - name: Gerar instalador Windows NSIS
        run: npm run dist:package
      - name: Conferir versão e checksum
        shell: pwsh
        run: |
          $version=(Get-Content package.json | ConvertFrom-Json).version
          $file="release/ArtiSys-Financeiro-Setup-$version.exe"
          if(-not (Test-Path $file)){throw "Instalador não encontrado: $file"}
          $size=(Get-Item $file).Length
          if($size -lt 50000000){throw "Instalador inesperadamente pequeno"}
          $hash=(Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "Instalador: $file"
          "Size: $size"
          "SHA256: $hash"
          "SHA256_VERSION=$version" >> $env:GITHUB_ENV
      - name: Preservar instalador como artefato privado do Actions
        uses: actions/upload-artifact@v4
        with:
          name: artisys-financeiro-windows-${{ github.sha }}
          path: release/ArtiSys-Financeiro-Setup-${{ env.SHA256_VERSION }}.exe
          if-no-files-found: error
          retention-days: 90

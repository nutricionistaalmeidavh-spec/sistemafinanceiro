rules:
  - id: artisys-no-eval
    languages: [javascript, typescript, python]
    message: Avoid dynamic code execution; parse structured input instead.
    severity: ERROR
    pattern: eval(...)
  - id: artisys-no-shell-exec
    languages: [javascript, typescript]
    message: Use execFile or spawn with fixed executable and shell disabled.
    severity: WARNING
    pattern-either:
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)
  - id: artisys-no-disabled-tls
    languages: [javascript, typescript]
    message: TLS certificate verification must remain enabled.
    severity: ERROR
    pattern: '{rejectUnauthorized: false, ...}'
